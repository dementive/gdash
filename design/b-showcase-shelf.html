<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>B — Showcase Shelf</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", sans-serif; }
  #stage { position: absolute; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; color: #f4f7fb; }
  .layer { position: absolute; inset: 0; }
  #hero, #hero2 { background-size: cover; background-position: center 15%; transition: opacity .8s ease, transform 8s linear; }
  #shade { background:
      linear-gradient(90deg, rgba(3,5,8,.92) 0%, rgba(3,5,8,.55) 32%, rgba(3,5,8,0) 62%),
      linear-gradient(0deg, rgba(3,5,8,1) 0%, rgba(3,5,8,.85) 26%, rgba(3,5,8,0) 58%),
      linear-gradient(180deg, rgba(3,5,8,.7) 0%, rgba(3,5,8,0) 18%); }

  .topbar { position: absolute; left: 72px; right: 72px; top: 34px; display: flex; align-items: center; gap: 34px; }
  .orb { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8ffb0, #5fc21f 45%, #1d5c06 100%); box-shadow: 0 0 20px rgba(120,230,60,.75); margin-right: 8px; }
  .bump { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,.14); opacity: .8; }
  #tabs { display: flex; gap: 34px; }
  .tab { font-size: 22px; font-weight: 400; opacity: .5; position: relative; padding-bottom: 8px; cursor: pointer; transition: opacity .2s; }
  .tab.on { opacity: 1; font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .clock { margin-left: auto; font-size: 20px; font-weight: 300; }

  #info { position: absolute; left: 72px; top: 200px; width: 640px; }
  #logo { max-width: 560px; max-height: 190px; display: block; filter: drop-shadow(0 8px 24px rgba(0,0,0,.8)); }
  #logotext { font-size: 58px; font-weight: 600; line-height: 1.05; text-shadow: 0 6px 24px rgba(0,0,0,.8); }
  #meta { margin-top: 22px; font-size: 18px; opacity: .8; display: flex; gap: 14px; align-items: center; }
  #meta .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .6; }
  .actions { margin-top: 28px; display: flex; gap: 14px; }
  .btn { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 26px 0 12px; border-radius: 26px; font-size: 19px; font-weight: 600;
         background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); backdrop-filter: blur(14px); }
  .btn.primary { background: #f4f7fb; color: #0b1016; box-shadow: 0 0 30px -6px var(--c); }
  .btn b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 14px; }
  .pa { background: radial-gradient(circle at 35% 30%, #9be36a, #3d9a12); } .py { background: radial-gradient(circle at 35% 30%, #ffe27a, #c79a07); }

  #shelfwrap { position: absolute; left: 0; right: 0; bottom: 70px; height: 330px; }
  #shelf { position: absolute; left: 72px; bottom: 0; display: flex; align-items: flex-end; gap: 22px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .tile { width: 170px; height: 255px; border-radius: 10px; background-size: cover; background-position: center; flex: none; position: relative; cursor: pointer;
          box-shadow: 0 16px 34px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.1); transition: width .3s cubic-bezier(.2,.8,.2,1), height .3s cubic-bezier(.2,.8,.2,1), opacity .3s, box-shadow .3s; opacity: .72; }
  .tile.sel { width: 210px; height: 315px; opacity: 1; box-shadow: 0 0 0 3px #fff, 0 0 40px 4px var(--c), 0 24px 50px rgba(0,0,0,.7); }
  .tile .badge { position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 3px 8px; border-radius: 5px; background: rgba(0,0,0,.65); }
  #count { position: absolute; right: 72px; bottom: 410px; font-size: 15px; opacity: .55; letter-spacing: 1px; }

  .prompts { position: absolute; left: 72px; bottom: 24px; display: flex; gap: 26px; font-size: 15px; opacity: .7; }
  .prompts b { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 50%; font-size: 11px; margin-right: 6px; color: #fff; }
  .pl { border-radius: 5px !important; padding: 0 6px; background: rgba(255,255,255,.2); }
  .label { position: absolute; right: 72px; bottom: 24px; font-size: 13px; letter-spacing: 2px; opacity: .45; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <div id="hero" class="layer"></div>
  <div id="hero2" class="layer" style="opacity:0"></div>
  <div id="shade" class="layer"></div>

  <div class="topbar"><div class="orb"></div><span class="bump">LB</span><div id="tabs"></div><span class="bump">RB</span><div class="clock">9:24 PM</div></div>

  <div id="info">
    <img id="logo"><div id="logotext"></div>
    <div id="meta"></div>
    <div class="actions"><div class="btn primary"><b class="pa">A</b>Play</div><div class="btn"><b class="py">Y</b>Details</div></div>
  </div>

  <div id="count"></div>
  <div id="shelfwrap"><div id="shelf"></div></div>

  <div class="prompts"><span><b style="background:#3d9a12">A</b>Play</span><span><b style="background:#b8231a">B</b>Back</span><span><b class="pl">≡</b>Guide</span></div>
  <div class="label">Direction B · Showcase Shelf — ←→ move, Q/E categories</div>
</div>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
let b = 0, sel = BLADES.map(() => 0), front = 'hero';
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); const st = $('stage').style; st.transform = `scale(${s})`; st.left = (innerWidth - 1600 * s) / 2 + 'px'; st.top = (innerHeight - 900 * s) / 2 + 'px'; }
function render() {
  const bl = BLADES[b], g = bl.games[sel[b]];
  document.documentElement.style.setProperty('--c', bl.color);
  $('tabs').innerHTML = BLADES.map((x, i) => `<div class="tab ${i === b ? 'on' : ''}" onclick="go(${i})">${x.name}</div>`).join('');
  $('shelf').innerHTML = bl.games.map((x, i) => `<div class="tile ${i === sel[b] ? 'sel' : ''}" onmouseenter="pick(${i})" style="background-image:url('${art(x.id, 'cover')}')">${b === 0 ? `<span class="badge">${x.system.toUpperCase()}</span>` : ''}</div>`).join('');
  $('shelf').style.transform = `translateX(${-Math.max(0, sel[b] - 2) * 192}px)`;
  $('count').textContent = `${sel[b] + 1} / ${bl.games.length}`;
  const next = front === 'hero' ? 'hero2' : 'hero';
  $(next).style.backgroundImage = `url('${art(g.id, 'hero')}')`; $(next).style.opacity = 1; $(front).style.opacity = 0; front = next;
  if (g.logo) { $('logo').src = art(g.id, 'logo'); $('logo').style.display = ''; $('logotext').textContent = ''; } else { $('logo').style.display = 'none'; $('logotext').textContent = g.title; }
  $('meta').innerHTML = [g.system, g.played || 'Not played yet'].map(t => `<span>${t}</span>`).join('<span class="dot"></span>');
}
function go(i) { b = Math.max(0, Math.min(BLADES.length - 1, i)); render(); }
function pick(i) { if (sel[b] !== i) { sel[b] = i; render(); } }
addEventListener('keydown', e => {
  const n = BLADES[b].games.length;
  if (e.key === 'ArrowRight') pick(Math.min(n - 1, sel[b] + 1));
  if (e.key === 'ArrowLeft') pick(Math.max(0, sel[b] - 1));
  if (e.key === 'e') go(b + 1);
  if (e.key === 'q') go(b - 1);
});
addEventListener('resize', fit); fit(); render();
</script>
</body>
</html>
